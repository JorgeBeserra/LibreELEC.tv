[Service]
Environment=XDG_CONFIG_HOME=/storage/.config
Environment=XDG_STATE_HOME=/storage/.local/state
ExecStartPre=+/bin/sh -c 'mkdir -p /storage/.local/state/wireplumber; for f in default-profile default-nodes; do if test ! -e /storage/.local/state/wireplumber/$$f; then cp /usr/share/rpi-cirrus/wireplumber/$$f /storage/.local/state/wireplumber/$$f; fi; done; chown -R pipewire:pipewire /storage/.local/state/wireplumber'
